<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="ICT Toilet Maintenance Report System — LIFF Screens">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#c9b8f5" opacity="0.55"/>
    </pattern>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- พื้นหลังกระดาษม่วงอ่อน + จุดสมุด -->
  <rect width="800" height="600" fill="#f3edff"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <!-- เทปกาว -->
  <g transform="rotate(-7 130 55)">
    <rect x="70" y="38" width="120" height="30" fill="#ddd6fe" stroke="#171717" stroke-width="2.5"/>
  </g>

  <!-- สติกเกอร์ CAPSTONE -->
  <g transform="rotate(-5 165 100)">
    <rect x="62" y="76" width="206" height="48" rx="14" fill="#7c3aed" stroke="#171717" stroke-width="3"/>
    <text x="165" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">🎓 CAPSTONE</text>
  </g>

  <!-- สปาร์กเคิล -->
  <g stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 60 260 l 0 -16 M 60 260 l 11 -5 M 60 260 l -11 -5"/>
    <path d="M 745 100 l 0 -16 M 745 100 l 11 -5 M 745 100 l -11 -5"/>
    <path d="M 700 480 l 0 -14 M 700 480 l 10 -5 M 700 480 l -10 -5"/>
  </g>

  <!-- ══════ หน้าจอ 1: ฟอร์มแจ้งซ่อม (บริการของสุขาภิบาล) ══════ -->
  <g transform="rotate(-2 210 325)">
    <rect x="100" y="122" width="240" height="430" rx="24" fill="#4c1d95" opacity="0.3" transform="translate(9 11)"/>
    <rect x="90" y="110" width="240" height="430" rx="24" fill="#ffffff" stroke="#171717" stroke-width="4"/>

    <!-- หัวม่วง -->
    <path d="M 90 134 q 0 -24 24 -24 h 192 q 24 0 24 24 v 34 h -240 z" fill="url(#headerGrad)"/>
    <text x="210" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#ffffff">บริการของสุขาภิบาล</text>

    <!-- การ์ดสถานที่ -->
    <rect x="104" y="184" width="212" height="66" rx="10" fill="#fdfbf9" stroke="#171717" stroke-width="2.5"/>
    <text x="116" y="206" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#171717">📍 สถานที่</text>
    <rect x="116" y="214" width="188" height="26" rx="8" fill="#f3edff" stroke="#171717" stroke-width="2"/>
    <text x="126" y="232" font-family="Arial, sans-serif" font-size="12" fill="#171717">อาคารสำนักงาน</text>
    <path d="M 288 223 l 5 7 l 5 -7" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"/>

    <!-- เลือกประเภท -->
    <text x="104" y="278" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#171717">เลือกประเภทสุขาภิบาล</text>
    <text x="104" y="294" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">*ต้องระบุให้ครบถ้วน</text>
    <rect x="104" y="300" width="212" height="28" rx="8" fill="#f3edff" stroke="#171717" stroke-width="2"/>
    <text x="114" y="319" font-family="Arial, sans-serif" font-size="12" fill="#171717">เลือกห้องสุขาภิบาล</text>
    <path d="M 296 309 l 5 7 l 5 -7" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"/>
    <rect x="104" y="336" width="212" height="28" rx="8" fill="#ececec" stroke="#b5b5b5" stroke-width="2"/>
    <text x="114" y="355" font-family="Arial, sans-serif" font-size="12" fill="#7a7a7a">เบอร์ห้องสุขาภิบาล</text>
    <path d="M 296 345 l 5 7 l 5 -7" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>

    <!-- แนบรูป -->
    <text x="104" y="394" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#171717">แนบรูป <tspan fill="#dc2626">*</tspan></text>
    <text x="160" y="394" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">*ขนาดรูปไม่เกิน 10 MB</text>
    <rect x="104" y="402" width="72" height="56" rx="8" fill="#ede9fe" stroke="#171717" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M 116 442 l 12 -16 l 9 11 l 8 -9 l 13 14 z" fill="#a78bfa" stroke="#171717" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="122" cy="418" r="4" fill="#facc15" stroke="#171717" stroke-width="1.5"/>
    <text x="140" y="452" font-family="Arial, sans-serif" font-size="9" fill="#6d28d9">ตัวอย่าง</text>

    <!-- อื่นๆ -->
    <rect x="104" y="478" width="17" height="17" rx="4" fill="#ffffff" stroke="#171717" stroke-width="2.5"/>
    <text x="130" y="492" font-family="Arial, sans-serif" font-size="13" fill="#171717">อื่นๆ</text>
  </g>

  <!-- ══════ หน้าจอ 2: แผนผังเลือกห้องน้ำ ══════ -->
  <g transform="rotate(2 590 325)">
    <rect x="480" y="122" width="240" height="430" rx="24" fill="#4c1d95" opacity="0.3" transform="translate(9 11)"/>
    <rect x="470" y="110" width="240" height="430" rx="24" fill="#ffffff" stroke="#171717" stroke-width="4"/>

    <text x="484" y="142" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#171717">ค้นห้องน้ำที่พบปัญหา:</text>
    <rect x="648" y="122" width="52" height="26" rx="8" fill="#16a34a" stroke="#171717" stroke-width="2"/>
    <text x="674" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">เลือก</text>

    <text x="484" y="166" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">* เลือกชั้นของห้องน้ำที่พบปัญหา</text>
    <text x="484" y="180" font-family="Arial, sans-serif" font-size="10" fill="#7c3aed">เปิดใช้งาน 10:00 น. (วันจันทร์ - ศุกร์)</text>

    <text x="484" y="212" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#171717">ชั้นของห้อง</text>
    <rect x="484" y="220" width="212" height="28" rx="8" fill="#f3edff" stroke="#171717" stroke-width="2"/>
    <text x="494" y="239" font-family="Arial, sans-serif" font-size="12" fill="#171717">ชั้น 1</text>
    <path d="M 676 229 l 5 7 l 5 -7" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"/>

    <!-- การ์ดแผนผัง -->
    <rect x="484" y="258" width="212" height="152" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="494" y="278" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#171717">📍 ชั้น 3 ตึก ICT 1</text>

    <!-- ห้องแถวบน -->
    <g stroke="#171717" stroke-width="2">
      <rect x="498" y="288" width="30" height="34" rx="3" fill="#fde047" transform="rotate(-4 513 305)"/>
      <rect x="534" y="286" width="30" height="34" rx="3" fill="#ef4444" transform="rotate(-2 549 303)"/>
      <rect x="570" y="286" width="30" height="34" rx="3" fill="#fde047" transform="rotate(0 585 303)"/>
      <rect x="606" y="288" width="30" height="34" rx="3" fill="#fde047" transform="rotate(2 621 305)"/>
      <rect x="642" y="292" width="30" height="34" rx="3" fill="#fde047" transform="rotate(4 657 309)"/>
      <!-- ห้องแถวล่าง -->
      <rect x="500" y="342" width="30" height="34" rx="3" fill="#fde047" transform="rotate(3 515 359)"/>
      <rect x="536" y="346" width="30" height="34" rx="3" fill="#fde047" transform="rotate(1 551 363)"/>
      <rect x="572" y="346" width="30" height="34" rx="3" fill="#fde047" transform="rotate(-1 587 363)"/>
      <rect x="608" y="344" width="30" height="34" rx="3" fill="#fde047" transform="rotate(-3 623 361)"/>
      <rect x="644" y="340" width="30" height="34" rx="3" fill="#fde047" transform="rotate(-5 659 357)"/>
    </g>
    <!-- หมุดบนห้องที่เลือก -->
    <g transform="translate(549 272)">
      <path d="M 0 0 c -8 0 -13 6 -13 13 c 0 10 13 22 13 22 c 0 0 13 -12 13 -22 c 0 -7 -5 -13 -13 -13 z" fill="#ef4444" stroke="#171717" stroke-width="2"/>
      <circle cx="0" cy="12" r="4.5" fill="#ffffff"/>
    </g>

    <!-- คำอธิบายสี -->
    <circle cx="500" cy="398" r="6" fill="#ef4444" stroke="#171717" stroke-width="1.5"/>
    <text x="512" y="402" font-family="Arial, sans-serif" font-size="10" fill="#171717">ห้องเลือก</text>
    <circle cx="580" cy="398" r="6" fill="#22c55e" stroke="#171717" stroke-width="1.5"/>
    <text x="592" y="402" font-family="Arial, sans-serif" font-size="10" fill="#171717">ห้องปกติ</text>

    <text x="484" y="440" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#171717">กรุณาเลือกห้องน้ำที่ต้องการแจ้ง</text>
    <rect x="484" y="452" width="212" height="28" rx="8" fill="#ececec" stroke="#b5b5b5" stroke-width="2"/>
    <text x="494" y="471" font-family="Arial, sans-serif" font-size="12" fill="#7a7a7a">เบอร์ห้องสุขาภิบาลที่เลือก</text>
    <path d="M 676 461 l 5 7 l 5 -7" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- คำโน้ตลายมือ -->
  <text x="400" y="584" text-anchor="middle" font-family="Segoe Script, Bradley Hand, cursive" font-size="24" fill="#4c1d95">LINE OA → LIFF → แจ้งซ่อมทันที ✨</text>
</svg>
