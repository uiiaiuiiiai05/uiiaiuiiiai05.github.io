<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="โต๊ะทำงานมุมมองด้านบน — สมุดสเก็ตช์ wireframe ปากกา กาแฟ โพสต์อิท แว่น สไตล์ Superr Notebook">
  <defs>
    <pattern id="deskDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#f0c9ab" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- พื้นโต๊ะกระดาษครีม + จุดสมุด -->
  <rect width="400" height="400" fill="#fdfbf9"/>
  <rect width="400" height="400" fill="url(#deskDots)"/>

  <!-- เทปกาวม่วงพาดมุมบน -->
  <g transform="rotate(-4 205 35)">
    <rect x="150" y="22" width="110" height="26" fill="#ddd6fe" stroke="#171717" stroke-width="2.5"/>
    <line x1="150" y1="30" x2="260" y2="30" stroke="#b7a4ee" stroke-width="2"/>
    <line x1="150" y1="41" x2="260" y2="41" stroke="#b7a4ee" stroke-width="2"/>
  </g>

  <!-- โพสต์อิทเหลือง -->
  <g transform="rotate(-8 78 82)">
    <rect x="42" y="46" width="72" height="72" fill="#fde047" stroke="#171717" stroke-width="4"/>
    <path d="M 114 46 L 114 78 L 82 46 Z" fill="#eabf1a" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#171717" stroke-width="3" stroke-linecap="round">
      <line x1="56" y1="72" x2="98" y2="72"/>
      <line x1="56" y1="86" x2="90" y2="86"/>
      <line x1="56" y1="100" x2="94" y2="100"/>
    </g>
  </g>

  <!-- กาแฟมุมขวาบน (มองจากด้านบน) -->
  <g transform="rotate(6 322 84)">
    <circle cx="322" cy="84" r="38" fill="#fdfbf9" stroke="#171717" stroke-width="5"/>
    <circle cx="322" cy="84" r="26" fill="#6b4226" stroke="#171717" stroke-width="3"/>
    <path d="M 314 78 c -4 6 4 10 0 16 M 326 76 c -4 6 4 10 0 16" fill="none" stroke="#fdfbf9" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 356 70 q 16 4 12 18 q -3 10 -14 8" fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- สมุดเปิดกลางโต๊ะ -->
  <g transform="rotate(-5 185 210)">
    <rect x="68" y="122" width="234" height="176" rx="12" fill="#7dd3fc" stroke="#171717" stroke-width="5"/>
    <!-- สายรัดเกลียวกลาง -->
    <g fill="none" stroke="#171717" stroke-width="3">
      <circle cx="185" cy="140" r="6"/>
      <circle cx="185" cy="160" r="6"/>
      <circle cx="185" cy="180" r="6"/>
      <circle cx="185" cy="200" r="6"/>
      <circle cx="185" cy="220" r="6"/>
      <circle cx="185" cy="240" r="6"/>
      <circle cx="185" cy="260" r="6"/>
      <circle cx="185" cy="278" r="6"/>
    </g>
    <!-- หน้าซ้าย: wireframe sketch -->
    <rect x="80" y="134" width="94" height="152" rx="6" fill="#fdfbf9" stroke="#171717" stroke-width="3"/>
    <rect x="88" y="142" width="78" height="14" rx="4" fill="#ff6f1e"/>
    <rect x="88" y="164" width="78" height="34" rx="4" fill="#f3edff" stroke="#b9a7e8" stroke-width="2"/>
    <rect x="88" y="206" width="36" height="34" rx="4" fill="#f3edff" stroke="#b9a7e8" stroke-width="2"/>
    <rect x="130" y="206" width="36" height="34" rx="4" fill="#f3edff" stroke="#b9a7e8" stroke-width="2"/>
    <rect x="88" y="248" width="78" height="10" rx="4" fill="#ffe3cc"/>
    <rect x="88" y="264" width="56" height="10" rx="4" fill="#e5ded2"/>
    <!-- หน้าขวา: โน้ตลายมือ + เช็คลิสต์ -->
    <rect x="196" y="134" width="94" height="152" rx="6" fill="#fdfbf9" stroke="#171717" stroke-width="3"/>
    <g stroke="#b9a7e8" stroke-width="3" stroke-linecap="round">
      <line x1="206" y1="152" x2="280" y2="152"/>
      <line x1="206" y1="168" x2="268" y2="168"/>
      <line x1="206" y1="184" x2="276" y2="184"/>
    </g>
    <g stroke="#171717" stroke-width="2.5" fill="#fdfbf9">
      <rect x="206" y="202" width="12" height="12" rx="3"/>
      <rect x="206" y="224" width="12" height="12" rx="3"/>
      <rect x="206" y="246" width="12" height="12" rx="3"/>
    </g>
    <path d="M 207 207 l 4 4 l 7 -8" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#b9a7e8" stroke-width="3" stroke-linecap="round">
      <line x1="226" y1="208" x2="280" y2="208"/>
      <line x1="226" y1="230" x2="272" y2="230"/>
      <line x1="226" y1="252" x2="278" y2="252"/>
    </g>
    <path d="M 206 274 q 20 8 40 0" fill="none" stroke="#ff6f1e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ปากกาส้มวางเฉียง -->
  <g transform="rotate(38 300 240)">
    <rect x="268" y="234" width="96" height="15" rx="7.5" fill="#ff6f1e" stroke="#171717" stroke-width="3.5"/>
    <path d="M 364 234 l 18 7.5 l -18 7.5 z" fill="#facc15" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
    <rect x="268" y="234" width="18" height="15" rx="6" fill="#ffe3cc" stroke="#171717" stroke-width="3"/>
  </g>

  <!-- โพสต์อิทชมพู -->
  <g transform="rotate(7 92 330)">
    <rect x="58" y="296" width="68" height="68" fill="#ff66cf" stroke="#171717" stroke-width="4"/>
    <g stroke="#fdfbf9" stroke-width="3.5" stroke-linecap="round">
      <line x1="72" y1="318" x2="112" y2="318"/>
      <line x1="72" y1="332" x2="104" y2="332"/>
      <line x1="72" y1="346" x2="110" y2="346"/>
    </g>
  </g>

  <!-- แว่นตาวงกลมมุมขวาล่าง -->
  <g transform="rotate(-10 312 322)" stroke="#171717" stroke-width="4.5" fill="#ffffff" fill-opacity="0.5">
    <circle cx="290" cy="322" r="24"/>
    <circle cx="344" cy="316" r="24"/>
    <path d="M 314 320 q 8 -4 16 -2" fill="none"/>
    <line x1="266" y1="318" x2="252" y2="312" stroke-linecap="round"/>
    <line x1="368" y1="312" x2="382" y2="306" stroke-linecap="round"/>
  </g>

  <!-- คลิปหนีดกระดาษ -->
  <g transform="rotate(20 350 380)" fill="none" stroke="#8b5cf6" stroke-width="3.5" stroke-linecap="round">
    <rect x="338" y="366" width="14" height="30" rx="7"/>
    <rect x="343" y="372" width="4" height="16" rx="2"/>
  </g>

  <!-- สปาร์กเคิล -->
  <g stroke="#ff8a3d" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 196 60 l 0 -14 M 196 60 l 10 -5 M 196 60 l -10 -5"/>
    <path d="M 60 200 l 0 -12 M 60 200 l 9 -4 M 60 200 l -9 -4"/>
    <path d="M 356 210 l 0 -12 M 356 210 l 9 -4 M 356 210 l -9 -4"/>
  </g>
</svg>
